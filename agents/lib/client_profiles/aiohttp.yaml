name: aiohttp
language: python
description: "Python aiohttp async HTTP client"
detection:
  file_patterns: ["**/*.py"]
  markers:
    - { pattern: "import aiohttp", type: import }
    - { pattern: "from aiohttp", type: import }
client_extraction:
  file_anchor:
    url_regex: "ClientSession\\([^)]*base_url\\s*=\\s*[frbu]*[\"']([^\"']+)[\"']"
    url_group: 1
  patterns:
    - regex: "(?:session|self\\._?session)\\.(get|post|put|delete|patch|head)\\s*\\(\\s*[frbu]*[\"']([^\"'{]+)[\"']"
      method_group: 1
      url_group: 2
