wiki:
  name: test-onboard-node-pg
  domain: node-services
  max_depth: 3
  ignore_file: .wiki-ignore
ecosystem:
  language: javascript
  framework: express
  framework_version: "4.18.0"
  detection_trace:
    - "package.json: dependencies.express ^4.18.0"
    - "package.json: dependencies.pg ^8.11.0"
    - "src/db.js: new Pool({ connectionString: process.env.DATABASE_URL })"
    - "src/db.js: fallback connection string postgres://<user>@db.local:5432/appdb (user redacted)"
    - "src/models/user.js: plain JS object literal (no ORM library detected)"
    - "wiki-orm-agent: orm_detected=null -> fall back to raw_sql"
  agents:
    source: {}
    custom: []
    model_overrides: {}
  credentials:
    provider: env
    config: {}
  database:
    enabled: true
    driver: postgresql
    environments:
      dev:
        host: db.local
        port: 5432
        database: appdb
        user_secret: WIKI_DB_DEV_USER
        password_secret: WIKI_DB_DEV_PASSWORD
        connection_string_redacted: "postgres://${WIKI_DB_DEV_USER}@db.local:5432/appdb"
    policy:
      block_ddl: true
      block_privilege: true
      dml_mode: escalate
      escalate_unbounded_reads: true
    audit:
      enabled: true
      path: ~/.wiki/db_audit.jsonl
  orm:
    enabled: true
    profiles:
      - raw_sql
    custom_profiles: []
    cross_validate_against_db: true
  rest:
    enabled: false
    custom_profiles: []
  claude_md:
    enabled: true
    submodule_support: true
    marked_sections: true
    preserve_user_sections: true
  mermaid:
    auto_generate: true
    types:
      - erDiagram
      - sequenceDiagram
      - graph
    lint_syntax: true
autonomy:
  mode: balanced
  overrides:
    broken_links: auto_fix
    missing_frontmatter: auto_fix
    contradictions: human_review
    stale_content: suggest
sources:
  providers:
    file:
      type: static
credentials:
  provider: keychain
  fallback:
    - env_var
  prefix: WIKI_
lint:
  auto_run_after_ingest: true
  checks:
    structural:
      - broken_links
      - missing_frontmatter
      - orphan_pages
      - index_coverage
      - summaries_sync
      - mermaid_syntax
      - orm_mapping_freshness
    heuristic:
      - contradictions
      - stale_content
      - terminology_consistency
      - quality_scoring
  auto_fix:
    broken_links: true
    missing_frontmatter: true
  thresholds:
    thin_cluster_min_pages: 3
claims:
  confidence_range:
    - 0
    - 1
  status_lifecycle:
    - proposed
    - supported
    - challenged
    - deprecated
  failure_reason_required: true
security:
  url_schemes:
    - http
    - https
  block_file_redirects: true
  fetch_size_cap_mb: 50
  fetch_timeout_s: 60
  path_containment_check: true
  label_sanitization:
    strip_control_chars: true
    max_length: 256
    html_escape: true
code_locality:
  local_rule: same_repo_and_readable
  local_snippet_max_lines: 6
  external_default: copy_with_attribution
  drift_detection:
    enabled: true
    on_mismatch: lint_warning
refresh:
  stale_threshold: 7d
  auto_refresh: false
  keep_history: 3
  incremental_default: false
graph:
  enabled: true
  edges_file: graph/edges.jsonl
  edge_types:
    - supports
    - contradicts
    - extends
    - supersedes
  link_format: markdown
  provenance:
    levels:
      - EXTRACTED
      - INFERRED
      - AMBIGUOUS
    require_on_every_edge: true
cache:
  enabled: true
  dir: .wiki-cache
logging:
  format: jsonl
  events_file: log/events.jsonl
  daily_summaries: true
  per_agent_logging: true
hooks:
  crosslink:
    enabled: true
    skip_below_pages: 3
  tag_harmonize:
    enabled: true
    min_pages_for_tag: 2
    content_only: true
hooks_always_on:
  enabled: true
multimodal:
  enabled: optional
