wiki:
  name: myapp
  domain: spring-boot-backend
  max_depth: 3
  ignore_file: .wiki-ignore
  language: java
  build_tool: maven
  framework: spring-boot
ecosystem:
  agents:
    source: {}
    custom: []
    model_overrides: {}
    integration:
      wiki-db-agent:
        enabled: true
        driver: postgresql
      wiki-orm-agent:
        enabled: true
        profile: jpa
    maintenance:
      wiki-claude-md-agent:
        enabled: true
      wiki-mermaid-agent:
        enabled: true
  credentials:
    provider: file
    config:
      path: ~/.wiki/credentials.json
  database:
    enabled: true
    driver: postgresql
    environments:
      dev:
        host: localhost
        port: 5432
        database: mydb
        user_secret: WIKI_DB_DEV_USER
        password_secret: WIKI_DB_DEV_PASSWORD
        ssl: false
    policy:
      block_ddl: true
      block_privilege: true
      dml_mode: present_only
      escalate_unbounded_reads: true
    audit:
      enabled: true
      path: ~/.wiki/db_audit.jsonl
  orm:
    enabled: true
    profiles:
    - jpa
    custom_profiles: []
    cross_validate_against_db: true
  claude_md:
    enabled: true
    submodule_support: true
    marked_sections: true
    preserve_user_sections: true
  mermaid:
    auto_generate: true
    types:
    - erDiagram
    - sequenceDiagram
    - graph
    lint_syntax: true
autonomy:
  mode: balanced
  overrides:
    broken_links: auto_fix
    missing_frontmatter: auto_fix
    contradictions: human_review
    stale_content: suggest
sources:
  providers:
    file:
      type: static
credentials:
  provider: keychain
  fallback:
  - env_var
  prefix: WIKI_
lint:
  auto_run_after_ingest: true
  checks:
    structural:
    - broken_links
    - missing_frontmatter
    - orphan_pages
    - index_coverage
    - summaries_sync
    - mermaid_syntax
    - orm_mapping_freshness
    heuristic:
    - contradictions
    - stale_content
    - terminology_consistency
    - quality_scoring
    - claim_confidence_check
    - anti_repetition_check
  auto_fix:
    broken_links: true
    missing_frontmatter: true
  thresholds:
    thin_cluster_min_pages: 3
claims:
  confidence_range:
  - 0
  - 1
  status_lifecycle:
  - proposed
  - supported
  - challenged
  - deprecated
  failure_reason_required: true
security:
  url_schemes:
  - http
  - https
  block_file_redirects: true
  fetch_size_cap_mb: 50
  fetch_timeout_s: 60
  path_containment_check: true
  label_sanitization:
    strip_control_chars: true
    max_length: 256
    html_escape: true
code_locality:
  local_rule: same_repo_and_readable
  local_snippet_max_lines: 6
  external_default: copy_with_attribution
  drift_detection:
    enabled: true
    on_mismatch: lint_warning
refresh:
  stale_threshold: 7d
  auto_refresh: false
  keep_history: 3
  incremental_default: false
graph:
  enabled: true
  edges_file: graph/edges.jsonl
  edge_types:
  - supports
  - contradicts
  - extends
  - supersedes
  link_format: markdown
  provenance:
    levels:
    - EXTRACTED
    - INFERRED
    - AMBIGUOUS
    require_on_every_edge: true
cache:
  enabled: true
  dir: .wiki-cache
logging:
  format: jsonl
  events_file: log/events.jsonl
  daily_summaries: true
  per_agent_logging: true
hooks:
  crosslink:
    enabled: true
    skip_below_pages: 3
  tag_harmonize:
    enabled: true
    min_pages_for_tag: 2
    content_only: true
hooks_always_on:
  enabled: true
  phase_1_platforms:
    claude_code:
      pre_tool_use_hook:
        fires_before:
        - Glob
        - Grep
        - Read
    codex:
      pre_tool_use_hook:
        fires_before:
        - Bash
    cursor:
      always_apply: true
multimodal:
  enabled: optional
  vision:
    extensions:
    - png
    - jpg
    - jpeg
    - webp
    - gif
    - svg
  audio_video:
    extensions:
    - mp4
    - mov
    - mkv
    - webm
    - avi
    - m4v
    - mp3
    - wav
    - m4a
    - ogg
    whisper_model: small
