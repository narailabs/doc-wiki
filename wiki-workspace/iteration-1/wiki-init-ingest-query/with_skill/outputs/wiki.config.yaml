wiki:
  name: Test Project Wiki
  domain: software
  max_depth: 3
  ignore_file: .wiki-ignore
autonomy:
  mode: balanced
sources:
  providers:
    file:
      type: static
security:
  url_schemes:
  - http
  - https
  block_file_redirects: true
  fetch_size_cap_mb: 50
  fetch_timeout_s: 60
  path_containment_check: true
  label_sanitization:
    strip_control_chars: true
    max_length: 256
    html_escape: true
graph:
  enabled: true
  edges_file: graph/edges.jsonl
cache:
  enabled: true
  dir: .wiki-cache
logging:
  format: jsonl
  events_file: log/events.jsonl
